  title: Perfil Profesional
  summary: |
    Soy estudiante de **Administracion** en la Universidad Nacional - Sede Central, proxima a iniciar 3er ano.
    Me considero una persona *organizada*, *comunicativa* y con habilidades de **liderazgo**.

    Durante mi trayectoria academica y laboral he desarrollado competencias en **gestion administrativa**,
    *coordinacion de proyectos* y *manejo de grupos*, tanto en entornos educativos como laborales.

    Busco seguir aprendiendo y creciendo profesionalmente y personalmente en el area administrativa,
    aportando **responsabilidad**, *proactividad* y *compromiso* en cada tarea que realizo.

