  title: Perfil Profesional
  summary: |
    Soy estudiante de **Administración** en la Universidad Nacional - Sede Central, próxima a iniciar 3er año.
    Me considero una persona *organizada*, *comunicativa* y con habilidades de **liderazgo**.

    Durante mi trayectoria académica y laboral he desarrollado competencias en **gestión administrativa**,
    *coordinación de proyectos* y *manejo de grupos*, tanto en entornos educativos como laborales.

    Busco seguir aprendiendo y creciendo profesionalmente y personalmente en el área administrativa,
    aportando **responsabilidad**, *proactividad* y *compromiso* en cada tarea que realizo.

