# Folyo - CV as a Webpage
# Update content by editing the data.yml file inside _data folder.

# Site Settings
title: Folyo - Professional CV Template
url: 'https://ai-whisperers.github.io'
baseurl: '/folyo'

description: Folyo - Transform your CV into a beautiful webpage | AI Whisperers
# Style options: blue turquoise green berry orange ceramic teal
theme_skin: berry
chrome_mobile_color: '#6d1b4d'

# Tracker (disabled - add your own)
# analytics: UA-XXXXXXXX-X

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # http://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style

# Build settings
compress-site: yes

encoding: "utf-8"
compress_html: # - http://jch.penibelst.de/
  clippings: all
  ignore:
    envs: development

# Development Settings
port: 4000
host: 0.0.0.0
safe: false
