# =============================================================================
# ONLINE CV TEMPLATE - MAIN CONFIGURATION
# =============================================================================
# Update all the sections by editing the data.yml file inside _data folder.
# This file contains the main Jekyll configuration for your online CV

# Site Settings
title: Online CV Template # Change this to your name
url: '' # Change to your GitHub Pages URL
baseurl: '' # Change to your repository name, or leave empty for custom domain

description: A beautiful Jekyll theme for creating professional online CV # Customize your site description
# Style will be applied only after restarting the build or serve. Just choose one of the options.
theme_skin: orange # blue turquoise green berry orange ceramic teal oceanstale
chrome_mobile_color: #use hex colors (ex:#1976d2) or leave empty if you don't want a color for chrome mobile searchbar

# Analytics (Optional)
# Add your Google Analytics tracking ID here, or leave empty to disable
analytics: # UA-XXXXXXXXX-X

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # http://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style

# Build settings
compress-site: yes

encoding: "utf-8"
compress_html: # - http://jch.penibelst.de/
  clippings: all
  ignore:
    envs: development

# Development Settings
port: 4000
host: 0.0.0.0
safe: false
