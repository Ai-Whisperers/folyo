# =============================================================================
# ONLINE CV TEMPLATE - CONFIGURATION FILE
# =============================================================================
# This template is based on the online-cv Jekyll theme
# Customize all sections below with your personal information
# =============================================================================

# Theme configuration
theme_skin: teal # Available options: blue, turquoise, green, berry, orange, ceramic, teal, oceanstale

# Sidebar configuration
sidebar:
  position: right # left or right
  about: False # Set to True to show About section in sidebar instead of main content
  education: False # Set to True to show Education section in sidebar instead of main content

  # =============================================================================
  # PERSONAL INFORMATION
  # =============================================================================
  name: Your Full Name
  tagline: Your Professional Title | Your Expertise Areas
  avatar: profile-picture.jpg # Place your image in assets/images/ folder
  
  # Contact Information
  email: your.email@example.com
  phone: '+1 (555) 123-4567' # Include country code
  timezone: America/New_York # Your timezone
  citizenship: Your Nationality # Optional
  website: https://yourwebsite.com # Optional
  linkedin: your-linkedin-username # Optional - just the username, not full URL
  github: your-github-username # Optional - just the username, not full URL
  pdf: "path/to/your/resume.pdf" # Optional - link to downloadable PDF resume

  # =============================================================================
  # LANGUAGES
  # =============================================================================
  languages:
    title: Languages
    info:
      - idiom: English
        level: Native # Native, Fluent, Professional, Conversational, Basic
      - idiom: Spanish  
        level: Professional
      - idiom: French
        level: Conversational
      # Add more languages as needed

# =============================================================================
# INTERESTS/HOBBIES
# =============================================================================
interests:
  title: Interests
  info:
    - item: Software Development
    - item: Data Analysis
    - item: Machine Learning
    - item: Open Source Projects
    - item: Technology Innovation
    - item: Continuous Learning
    # Add more interests as needed

# =============================================================================
# CAREER PROFILE / SUMMARY
# =============================================================================
career-profile:
  title: Career Profile
  summary: |
    Write a compelling **professional summary** that highlights your key strengths, experience, and career objectives. 
    Use **bold text** for important keywords and *italics* for emphasis.
    
    This section should be 2-3 paragraphs that showcase:
    • Your professional background and expertise
    • Key achievements and skills
    • Career goals and what you bring to potential employers
    
    Keep it engaging and results-focused while maintaining a professional tone.

# =============================================================================
# EDUCATION
# =============================================================================
education:
  title: Education
  info:
    - degree: Master of Science in Computer Science
      university: University Name
      time: 2020 – 2022
      details: |
        - **Relevant Coursework**: Data Structures, Algorithms, Machine Learning, Database Systems
        - **GPA**: 3.8/4.0
        - **Thesis**: "Advanced Machine Learning Techniques for Data Analysis"
        - **Awards**: Dean's List, Outstanding Student in Computer Science
        
    - degree: Bachelor of Science in Software Engineering
      university: Previous University
      time: 2016 – 2020
      details: |
        - **Major**: Software Engineering with concentration in Web Development
        - **Minor**: Mathematics
        - **Senior Project**: Full-stack web application for project management
        - **Extracurricular**: Computer Science Club President, Hackathon winner
        
    # Add more education entries as needed

# =============================================================================
# WORK EXPERIENCE
# =============================================================================
experiences:
  title: Experiences
  info:
    - role: Senior Software Developer
      time: 2022 – Present
      company: Tech Company Name
      details: |
        - **Led development** of core platform features serving 10,000+ daily active users
        - **Implemented** microservices architecture resulting in 40% performance improvement
        - **Collaborated** with cross-functional teams including Product, Design, and QA
        - **Mentored** 3 junior developers and conducted code reviews
        - **Technologies used**: Python, React, PostgreSQL, AWS, Docker
      tags: ["Python", "React", "AWS", "Team Leadership", "Microservices"]
      icon: "code"

    - role: Software Developer
      time: 2020 – 2022
      company: Previous Company Name
      details: |
        - **Developed** responsive web applications using modern JavaScript frameworks
        - **Optimized** database queries reducing page load times by 25%
        - **Participated** in Agile development process and daily standups
        - **Built** RESTful APIs and integrated third-party services
        - **Maintained** high code quality through unit testing and CI/CD practices
      tags: ["JavaScript", "Node.js", "SQL", "REST APIs", "Agile"]
      icon: "laptop"

    # Add more experience entries as needed

# =============================================================================
# PROJECTS
# =============================================================================
projects:
  title: Projects
  intro: >
    A showcase of personal and professional projects demonstrating technical skills and problem-solving abilities.
  assignments:
    - title: E-Commerce Platform
      time: 2023
      details: |
        - **Built** a full-stack e-commerce platform with payment integration
        - **Implemented** user authentication, shopping cart, and order management
        - **Used** React for frontend, Node.js for backend, and MongoDB for database
        - **Deployed** on AWS with CI/CD pipeline using GitHub Actions
        - **Features**: Product search, user reviews, admin dashboard, email notifications

    - title: Data Visualization Dashboard
      time: 2022
      details: |
        - **Created** interactive dashboard for business analytics and reporting
        - **Processed** large datasets and created meaningful visualizations
        - **Technologies**: Python, Pandas, Plotly, Dash, PostgreSQL
        - **Impact**: Helped management make data-driven decisions, increased efficiency by 30%

    - title: Mobile Task Management App
      time: 2021
      details: |
        - **Developed** cross-platform mobile app for personal productivity
        - **Features**: Task creation, deadline tracking, team collaboration, push notifications
        - **Built with**: React Native, Firebase, Redux for state management
        - **Published** on both iOS and Android app stores with 500+ downloads

    # Add more projects as needed

# =============================================================================
# VOLUNTEER WORK (Optional)
# =============================================================================
volunteer:
  title: Volunteer Work
  info:
    - role: Code Mentor
      time: 2021 – Present
      details: |
        - **Mentored** aspiring developers through coding bootcamp programs
        - **Conducted** weekly workshops on web development fundamentals
        - **Helped** 20+ students successfully transition to tech careers
        - **Organized** community coding events and hackathons

    # Add more volunteer experiences as needed

# =============================================================================
# SKILLS & PROFICIENCY
# =============================================================================
skills:
  title: Skills & Proficiency
  toolset:
    - name: Programming Languages
      level: 90%
      tags: [Python, JavaScript, Java, C++, TypeScript]
      
    - name: Web Development
      level: 85%
      tags: [React, Node.js, HTML5, CSS3, Vue.js, Angular]
      
    - name: Database & Data
      level: 80%
      tags: [PostgreSQL, MongoDB, MySQL, Redis, Data Analysis, SQL]
      
    - name: Cloud & DevOps
      level: 75%
      tags: [AWS, Docker, Kubernetes, CI/CD, Jenkins, Git]
      
    - name: Tools & Frameworks
      level: 85%
      tags: [Django, Flask, Express.js, Jest, Webpack, REST APIs]

    # Add more skill categories as needed

# =============================================================================
# CERTIFICATIONS
# =============================================================================
certifications:
  title: Certifications
  list:
    - name: AWS Certified Solutions Architect
      start: 2023
      organization: Amazon Web Services
      details: |
        Validated expertise in designing distributed systems on AWS. Covered:
        - **Cloud Architecture**: Designing scalable and fault-tolerant systems
        - **Security**: Implementing security best practices and compliance
        - **Cost Optimization**: Managing resources efficiently
        - **Performance**: Optimizing application performance on AWS
        
    - name: Certified Scrum Master (CSM)
      start: 2022
      organization: Scrum Alliance
      details: |
        Demonstrated understanding of Scrum framework and agile principles:
        - **Scrum Events**: Sprint planning, daily standups, retrospectives
        - **Team Facilitation**: Leading cross-functional development teams
        - **Continuous Improvement**: Implementing agile best practices
        - **Stakeholder Collaboration**: Managing product owner and team relationships

    # Add more certifications as needed

# =============================================================================
# OPEN SOURCE CONTRIBUTIONS (Optional)
# =============================================================================
oss:
  title: Open Source Contributions
  intro: >
    Contributions to open source projects and community involvement.
  contributions:
    - title: Popular Library Name
      details: |
        - **Contributed** feature improvements and bug fixes
        - **Added** comprehensive documentation and examples
        - **Maintained** backward compatibility while enhancing performance
        - **Impact**: Used by 10,000+ developers globally
      # Add more contributions as needed

# =============================================================================
# PUBLICATIONS (Optional)
# =============================================================================
publications:
  title: Publications
  intro: >
    Research papers, articles, and technical publications.
  papers:
    - title: "Title of Your Research Paper or Article"
      authors: Your Name, Co-Author Name
      conference: Conference or Journal Name
      details: |
        Brief description of the research, methodology, and key findings.
        This section is optional and can be removed if not applicable.
      # Add more publications as needed

# =============================================================================
# RECOMMENDATIONS (Optional)
# =============================================================================
recommendations:
  title: Recommendations
  intro: >
    Professional recommendations and testimonials.
  testimonials:
    - name: John Smith
      title: Senior Manager at Company Name
      details: |
        "Brief testimonial highlighting your key strengths, work quality, and professional impact.
        This is optional and can be used to showcase endorsements from colleagues or supervisors."
      # Add more recommendations as needed

# =============================================================================
# FOOTER CUSTOMIZATION
# =============================================================================
footer: >
  Designed with <i class="fas fa-heart"></i> by [Your Name]